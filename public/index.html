<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>实验对话系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23111213'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
  <style>
    :root {
      --fg: #111213;
      --muted: #7a7a80;
      --faint: #b3b3b9;
      --border: #e8e8ea;
      --border-strong: #c9c9ce;
      --accent: #111213;
      --accent-hover: #2a2b2e;
      --danger: #c03434;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      --ease-out: cubic-bezier(0.21, 0.9, 0.35, 1);
    }

    * { box-sizing: border-box; }
    .hidden { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: var(--font);
      color: var(--fg);
      background: #fff;
      -webkit-font-smoothing: antialiased;
      animation: page-in 0.4s ease both;
    }

    .panel { width: min(92vw, 400px); animation: rise-in 0.5s var(--ease-out) both; }

    .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 22px; }
    .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); position: relative; flex: 0 0 auto; }
    .dot::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #fff; }
    .brand-name { font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em; }

    .card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 24px;
      background: #fff;
    }
    .card + .card { margin-top: 16px; }

    .card-title { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
    .card-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 16px; line-height: 1.7; }

    .field { display: block; margin-bottom: 12px; }
    .field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .field input {
      width: 100%;
      font: inherit;
      font-size: 14px;
      color: var(--fg);
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      outline: none;
      transition: border-color 0.18s ease;
    }
    .field input:focus { border-color: var(--border-strong); background: #fff; }

    .go {
      display: block; width: 100%; margin-top: 4px;
      font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: var(--accent);
      border: 0; border-radius: 999px; padding: 12px; cursor: pointer;
      transition: background 0.16s ease, opacity 0.16s ease;
    }
    .go:hover:not(:disabled) { background: var(--accent-hover); }
    .go:disabled { opacity: 0.5; cursor: not-allowed; }

    .row-links {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 14px; font-size: 12.5px;
    }
    .link-btn {
      font: inherit; font-size: 12.5px; color: var(--muted);
      background: none; border: 0; padding: 0; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .link-btn:hover { color: var(--fg); }

    .err {
      margin: 0 0 12px; font-size: 12.5px; color: var(--danger);
    }

    .divider { text-align: center; margin: 14px 0 2px; font-size: 11.5px; color: var(--faint); }

    @keyframes page-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    @media (max-width: 480px) {
      body { padding: 28px 14px; }
      .card { padding: 22px 18px; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <span class="brand-name">实验对话系统</span>
    </div>

    <!-- 登录 / 注册 -->
    <div class="card">
      <div id="login-block">
        <h2 class="card-title">账号登录</h2>
        <p class="card-sub">登录后进入实验与问卷管理。</p>
        <form id="login-form" autocomplete="off">
          <label class="field"><span>账号</span><input id="login-username" type="text" autocomplete="username"></label>
          <label class="field"><span>密码</span><input id="login-password" type="password" autocomplete="current-password"></label>
          <p id="login-error" class="err hidden"></p>
          <button id="login-btn" class="go" type="submit">登录</button>
        </form>
        <div class="row-links">
          <button id="show-register" class="link-btn" type="button">注册新账号</button>
          <button id="show-reset" class="link-btn" type="button">重置密码</button>
        </div>
      </div>

      <div id="register-block" class="hidden">
        <h2 class="card-title">注册新账号</h2>
        <p class="card-sub">注册后即可登录并创建自己的实验与问卷。</p>
        <form id="register-form" autocomplete="off">
          <label class="field"><span>账号</span><input id="reg-username" type="text" maxlength="32" autocomplete="username"></label>
          <label class="field"><span>密码（至少 6 位）</span><input id="reg-password" type="password" autocomplete="new-password"></label>
          <label class="field"><span>确认密码</span><input id="reg-password2" type="password" autocomplete="new-password"></label>
          <p id="reg-error" class="err hidden"></p>
          <button id="reg-btn" class="go" type="submit">注册并登录</button>
        </form>
        <div class="row-links">
          <button id="back-login" class="link-btn" type="button">返回登录</button>
          <span></span>
        </div>
      </div>

      <div id="reset-block" class="hidden">
        <h2 class="card-title">重置密码</h2>
        <p class="card-sub">
          为保障数据安全，密码重置需要管理员协助处理。<br>
          请联系实验管理员，提供您的账号，由管理员在「用户管理」中为您重置密码。
        </p>
        <div class="row-links">
          <button id="back-login2" class="link-btn" type="button">返回登录</button>
          <span></span>
        </div>
      </div>
    </div>

    <!-- 问卷入口：填链接或短码直接进入被试端 -->
    <div class="card">
      <h2 class="card-title">填写问卷</h2>
      <p class="card-sub">粘贴问卷链接或输入问卷短码，无需登录。</p>
      <form id="survey-form" autocomplete="off">
        <label class="field"><span>问卷链接 / 短码</span><input id="survey-code" type="text" placeholder="例如：https://…/chat?q=abc12345 或 abc12345" autocomplete="off"></label>
        <button class="go" type="submit">进入问卷</button>
      </form>
    </div>
  </div>

  <script>
    var $ = function (id) { return document.getElementById(id); };

    function showBlock(name) {
      ['login-block', 'register-block', 'reset-block'].forEach(function (id) {
        $(id).classList.toggle('hidden', id !== name + '-block');
      });
    }
    $('show-register').addEventListener('click', function () { showBlock('register'); });
    $('show-reset').addEventListener('click', function () { showBlock('reset'); });
    $('back-login').addEventListener('click', function () { showBlock('login'); });
    $('back-login2').addEventListener('click', function () { showBlock('login'); });

    function showErr(id, msg) { $(id).textContent = msg; $(id).classList.remove('hidden'); }
    function hideErr(id) { $(id).classList.add('hidden'); }

    async function post(path, body) {
      var res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.message || '请求失败，请重试');
      return data;
    }

    $('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var username = $('login-username').value.trim();
      var password = $('login-password').value;
      if (!username || !password) { showErr('login-error', '请输入账号和密码'); return; }
      hideErr('login-error');
      $('login-btn').disabled = true;
      try {
        var res = await post('/api/auth/login', { username: username, password: password });
        sessionStorage.setItem('expchat_admin_token', res.token);
        location.href = '/admin';
      } catch (err) {
        showErr('login-error', err.message);
        $('login-btn').disabled = false;
      }
    });

    $('register-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var username = $('reg-username').value.trim();
      var password = $('reg-password').value;
      var password2 = $('reg-password2').value;
      if (!username) { showErr('reg-error', '请输入账号'); return; }
      if (password.length < 6) { showErr('reg-error', '密码至少 6 位'); return; }
      if (password !== password2) { showErr('reg-error', '两次输入的密码不一致'); return; }
      hideErr('reg-error');
      $('reg-btn').disabled = true;
      try {
        var res = await post('/api/auth/register', { username: username, password: password });
        sessionStorage.setItem('expchat_admin_token', res.token);
        location.href = '/admin';
      } catch (err) {
        showErr('reg-error', err.message);
        $('reg-btn').disabled = false;
      }
    });

    // 支持粘贴完整链接（提取 q= 参数）或直接输入短码
    $('survey-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var raw = $('survey-code').value.trim();
      if (!raw) return;
      var code = raw;
      try {
        var url = new URL(raw);
        var q = url.searchParams.get('q') || url.searchParams.get('c');
        if (q) code = q.trim();
      } catch (err) { /* 不是 URL：当作短码 */ }
      if (!code) return;
      location.href = '/chat?q=' + encodeURIComponent(code);
    });
  </script>
</body>
</html>
