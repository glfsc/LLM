<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>智能问卷助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23111213'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/chat.css">
  <link rel="stylesheet" href="/assets/survey.css">
</head>
<body class="survey-page">
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name">智能问卷助手</span>
          <span id="brand-sub" class="brand-sub hidden"></span>
        </div>
        <span id="brand-tag" class="brand-tag hidden"></span>
      </div>
    </header>

    <main id="chat-scroll" class="chat-scroll">
      <div id="chat-stream" class="chat-stream" aria-live="polite"></div>
    </main>

    <footer id="composer-wrap" class="composer-wrap hidden">
      <div id="s-card" class="s-card">
        <div class="s-qhead">
          <span id="s-tag" class="s-tag"></span>
          <span id="s-hint" class="s-hint"></span>
          <button id="s-collapse" class="s-collapse" type="button" aria-label="收起 / 展开作答区">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
        <p id="s-title" class="s-title"></p>
        <div id="s-controls" class="s-controls"></div>
        <div id="s-foot" class="s-foot">
          <span id="s-anchor" class="s-anchor"></span>
          <button id="btn-skip" class="ghost-btn hidden" type="button">跳过本题</button>
          <button id="btn-submit" class="primary-btn" type="button" disabled>确认提交</button>
        </div>
        <p id="s-tip" class="s-tip hidden"></p>
        <p id="s-err" class="s-error hidden"></p>
      </div>
    </footer>
  </div>

  <!-- 完成页（终态：展示结束语文本，无任何跳转） -->
  <div id="done-screen" class="done-screen gate hidden">
    <div class="done-card gate-card">
      <h2 id="done-title">感谢您的参与</h2>
      <div id="done-text" class="gate-text"></div>
    </div>
  </div>

  <!-- 异常提示页 -->
  <div id="error-screen" class="done-screen hidden">
    <div class="done-card">
      <h2>无法进入问卷</h2>
      <p id="error-text">请检查链接是否正确。</p>
    </div>
  </div>

  <script src="/assets/survey.js"></script>
</body>
</html>
