<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>智能评估系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23111213'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/chat.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-name">智能评估系统</span>
        </div>
        <button id="btn-collapse-all" class="ghost-btn" type="button">隐藏已答题</button>
        <button id="btn-redo" class="ghost-btn" type="button">重做</button>
      </div>
    </header>

    <main id="chat-scroll" class="chat-scroll">
      <div id="chat-stream" class="chat-stream" aria-live="polite"></div>
    </main>

    <!-- 常驻输入框：文本题在这里输入并发送；其他题型可见但发不出去 -->
    <footer class="composer" id="composer">
      <div class="composer-inner">
        <textarea id="composer-input" class="composer-input" rows="1" placeholder="输入你的回答…"></textarea>
        <button id="composer-send" class="primary-btn composer-send" type="button" disabled>发送</button>
      </div>
      <!-- 「需输入指定内容」的题：发送前的断言没过时，提示显示在这里（这一笔不会发送出去） -->
      <p id="composer-error" class="composer-error hidden" role="alert"></p>
      <p id="composer-hint" class="composer-hint"></p>
      <!-- 备案号：工信部要求网站底部悬挂 ICP 备案号，并链接至工信部备案管理系统 -->
      <p class="composer-foot">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2026155269号</a>
      </p>
    </footer>
  </div>

  <!-- 全屏页面：知情同意页（gate）/ 结束说明页（debrief） -->
  <div id="page-screen" class="page-screen hidden">
    <div class="page-card">
      <h2 id="page-title"></h2>
      <div id="page-text" class="page-text rich"></div>
      <label id="page-check-wrap" class="page-check">
        <input id="page-check" type="checkbox">
        <span id="page-check-label"></span>
      </label>
      <!-- 知情同意页（含编号）形态：填写编号后才能点进入按钮 -->
      <div id="page-id-wrap" class="page-id hidden">
        <label id="page-id-label" for="page-id-input">被试编号</label>
        <input id="page-id-input" class="answer-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <p id="page-hint" class="page-hint hidden"></p>
      <button id="page-btn" class="page-go" type="button">继续</button>
    </div>
  </div>

  <!-- 应用内确认弹窗（重做断言等）：icon = 顶部圆形徽标（按需显示） -->
  <div id="confirm-mask" class="confirm-mask hidden">
    <div class="confirm-card">
      <div id="confirm-icon" class="confirm-icon hidden" aria-hidden="true">⚠</div>
      <h3 id="confirm-title">提示</h3>
      <p id="confirm-text" class="confirm-text"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="ghost-btn" type="button">取消</button>
        <button id="confirm-ok" class="page-go confirm-go" type="button">确定</button>
      </div>
    </div>
  </div>

  <!-- 切屏提醒：离开实验界面后回来时居中弹出（与「重做」确认同款样式，但各自独立） -->
  <div id="leave-mask" class="confirm-mask hidden">
    <div class="confirm-card">
      <h3 id="leave-title">请勿离开实验界面</h3>
      <p id="leave-text" class="confirm-text"></p>
      <div class="confirm-actions">
        <button id="leave-ok" class="page-go confirm-go" type="button">我知道了</button>
      </div>
    </div>
  </div>

  <!-- 异常提示页 -->
  <div id="error-screen" class="page-screen hidden">
    <div class="page-card">
      <h2>无法进入</h2>
      <p id="error-text" class="page-text">请检查链接是否正确。</p>
    </div>
  </div>

  <script src="/assets/richtext.js"></script>
  <script src="/assets/chat.js"></script>
</body>
</html>
